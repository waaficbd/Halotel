<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halotel Kikokotoo cha Mkopo</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(135deg, #ff6600, #ff8533);
            padding: 20px 20px 45px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 92%;
            max-width: 450px;
            margin-top: -30px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            color: #222;
            margin: 0 0 6px;
            text-align: center;
        }

        .subtext {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        .slider-section { margin-bottom: 25px; }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        .orange-text { color: #ff6600; font-weight: bold; }

        input[type=range] {
            width: 100%;
            accent-color: #ff6600;
            margin: 15px 0;
            height: 6px;
        }

        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
        }

        .result-container {
            background: #fff8f5;
            border: 1px solid #ffe0d1;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin: 25px 0;
        }

        .result-value {
            color: #ff6600;
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0 0;
        }

        .btn-apply {
            background: linear-gradient(to right, #ff6600, #ff8533);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
            transition: opacity 0.2s;
        }

        .btn-apply:active {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="app-header">
    <span>Halotel</span>
    <span>☰</span>
</div>

<div class="card">
    <h2>Pata Mkopo wa Haraka</h2>
    <div class="subtext">Uthibitisho wa Haraka • Riba Nafuu • Muda Inayofaa</div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Kiasi cha Mkopo</span>
            <span id="valAmt" class="orange-text">TZS 100,000</span>
        </div>
        <input type="range" id="amt" min="10000" max="5000000" step="10000" value="100000">
        <div class="slider-footer"><span>TZS 10,000</span><span>TZS 5,000,000</span></div>
    </div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Muda wa Mkopo</span>
            <span id="valDur" class="orange-text">Miezi 3</span>
        </div>
        <input type="range" id="dur" min="1" max="24" step="1" value="3">
        <div class="slider-footer"><span>Mwezi 1</span><span>Miezi 24</span></div>
    </div>

    <div class="result-container">
        <p style="margin:0; font-size:14px; color:#666">Marejesho kwa Mwezi</p>
        <p id="monthly" class="result-value">TZS 39,333</p>
    </div>

    <button class="btn-apply" onclick="goToPage2()">CODSO HADDA (Omba Sasa)</button>
</div>

<div class="footer">© 2026 Halotel Tanzania. Haki zote zimehifadhiwa.</div>

<script>
    function update() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;

        document.getElementById('valAmt').innerText = `TZS ${amount.toLocaleString()}`;
        document.getElementById('valDur').innerText = `${duration} ${duration === 1 ? 'Mwezi' : 'Miezi'}`;

        // Riba ya mfano (18%)
        const monthly = (amount * 1.18) / duration;
        document.getElementById('monthly').innerText = `TZS ${Math.round(monthly).toLocaleString()}`;
    }

    function goToPage2() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        localStorage.setItem('amount', amtEl.value);
        localStorage.setItem('loanDuration', durEl.value + " Miezi");

        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (amtEl) amtEl.addEventListener('input', update);
        if (durEl) durEl.addEventListener('input', update);

        update();
    };
</script>

</body>
</html>
